#
#  Sandboxed MinGW32 CI build
#

root: true

inherit:
  - env::i386-win32-gcc8

depends:
  - libs::openssl-bin
  - libs::sdl-bin
  - libs::sdlimage-bin
  - planets::pcc2-win-pkg
  - name: planets::phost-pkg
    environment:
      PHOST_TARGET: win32
  - tools::nsis-win32

buildScript: "true"
packageScript: "true"
